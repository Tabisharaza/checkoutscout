name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '24.19.0'
          - os: windows-latest
            node: '24.19.0'
          - os: macos-latest
            node: '24.19.0'
          - os: ubuntu-latest
            node: '22.x'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - name: Verify deterministic bundle
        shell: bash
        run: |
          cp dist/SHA256SUMS first-checksums.txt
          npm run build
          git diff --no-index first-checksums.txt dist/SHA256SUMS
      - run: npm run demo
      - run: git diff --exit-code -- examples
      - name: Audit this repository
        run: node bin/checkoutscout.js --strict
      - name: Smoke test built CLI
        run: node dist/bin/checkoutscout.js --help
